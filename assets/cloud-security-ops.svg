<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Cloud security telemetry interface</title>
  <desc id="desc">Abstract technical interface showing cloud nodes, identity paths, security panels, and telemetry lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060910"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#11142b"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" x2="1">
      <stop offset="0" stop-color="#55e6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#57f2b4" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="violetPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#55e6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8f7cff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.33 0 0 0 0 0.9 0 0 0 0 1 0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#b2cde1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
